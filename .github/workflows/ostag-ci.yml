name: OS Tag CI

on:
  push:
    branches: ["main", "ostag/**"]
  pull_request:

jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OSTAG_SKIP_OSSTACK_CROSS_REPO_SMOKE: "1"
      PYTEST_ADDOPTS: "-o faulthandler_timeout=60"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep pandoc
      - name: Install dependencies
        run: uv sync --all-extras --locked
      - name: Run release, deployment and live-evidence gates
        run: scripts/ci_release_gates.sh

  image-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build exact-source native production image
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git archive HEAD | docker build --platform linux/amd64 \
            -f deploy/work-monitor/Dockerfile \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "ostag-image:$GITHUB_SHA" -
      - name: Verify cold boot and disabled Brief control
        run: |
          python3 scripts/verify_work_monitor_image.py \
            --image "ostag-image:$GITHUB_SHA" --source-sha "$GITHUB_SHA" \
            --output image-verification
      - name: Preserve image verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work-monitor-image-verification
          path: image-verification/
          if-no-files-found: warn
