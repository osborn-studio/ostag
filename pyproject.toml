[project]
name = "ostag"
version = "0.2.0"
description = "OS Tag: an open control plane for human-agent collaboration — governed, auditable, multi-agent work loops from Feishu/Lark, DingTalk, Slack threads or the CLI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "OS Tag contributors" }]
dependencies = [
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
feishu = ["lark-oapi>=1.4.22"]
slack = ["slack-bolt>=1.22.0"]
dingtalk = ["dingtalk-stream>=0.24.3"]
openai = ["openai>=1.93.0"]
dev = ["pytest>=8.2.0", "pytest-asyncio>=0.23.0"]

[project.scripts]
ostag = "ostag.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
  "tests/test_doctor.py",
  "tests/test_ambient.py",
  "tests/test_ambient_v2.py",
  "tests/test_approval_quorum.py",
  "tests/test_approvals.py",
  "tests/test_audit_export.py",
  "tests/test_budget.py",
  "tests/test_auto_base_workflow.py",
  "tests/test_capabilities.py",
  "tests/test_channel_brain.py",
  "tests/test_channel_policy.py",
  "tests/test_cli_inspection.py",
  "tests/test_cli_receipts.py",
  "tests/test_cli_run.py",
  "tests/test_permissions.py",
  "tests/test_connectors.py",
  "tests/test_env_scrub.py",
  "tests/test_event_normalization.py",
  "tests/test_followups.py",
  "tests/test_four_eyes.py",
  "tests/test_github_connector.py",
  "tests/test_gitlab_connector.py",
  "tests/test_governed_tasks.py",
  "tests/test_governed_writes.py",
  "tests/test_mfs_client.py",
  "tests/test_memory.py",
  "tests/test_mock_backend.py",
  "tests/test_prompt.py",
  "tests/test_receipts.py",
  "tests/test_run_ledger.py",
  "tests/test_safety.py",
  "tests/test_schemas.py",
  "tests/test_stage_ledger.py",
]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
