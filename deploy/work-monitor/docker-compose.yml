services:
  work-monitor:
    build:
      context: ../..
      dockerfile: deploy/work-monitor/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      OSTAG_MONITOR_SERVER_DB: /var/lib/ostag/work_monitor.sqlite3
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - work-monitor-data:/var/lib/ostag
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  work-monitor-data:
